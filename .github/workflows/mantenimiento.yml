name: Mantenimiento de base de datos

# Aplica migraciones, actualiza semilla y (opcional) purga por reglas (operativo + valor formativo) en Neon/Postgres.
# No se ejecuta en deploy; use workflow_dispatch desde Actions cuando Camilo quiera actualizar producción.

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Backfills (sector): false = vista previa; true = escribe (--aplicar). No borra ofertas por sí solo."
        required: true
        type: boolean
        default: false
      purgar:
        description: "Purga por reglas: false = solo vista previa (nunca borra); true permite borrar si aplicar=true"
        required: true
        type: boolean
        default: false
      backfill_habilidades:
        description: "RF-18: tras migrar/semilla, repoblar habilidades e idiomas en ofertas guardadas"
        required: true
        type: boolean
        default: false
      backfill_sector:
        description: "§9.1: inferir sector faltante (usa «aplicar» abajo para escribir o solo contar)"
        required: true
        type: boolean
        default: false
      backfill_semestre:
        description: "Backfill: semestre opcional (vacío = todos)"
        required: false
        type: string
        default: ""
      backfill_corte:
        description: "Backfill: corte opcional (inicio, mitad, final; vacío = todos)"
        required: false
        type: string
        default: ""

concurrency:
  group: observatorio-mantenimiento
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  PYTHONUNBUFFERED: "1"

jobs:
  mantenimiento:
    name: Migrar, semilla y purga
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-scraper.txt
      - run: pip install -r requirements-scraper.txt
      - name: Migraciones Alembic
        run: |
          echo "=== Alembic upgrade head ==="
          python -m observatorio.run migrar
      - name: Semilla (config, términos, admin)
        run: |
          echo "=== Semilla ==="
          python -m observatorio.run semilla
      - name: Backfill sector industrial (§9.1)
        if: inputs.backfill_sector
        run: |
          ARGS=()
          if [ -n "${{ inputs.backfill_semestre }}" ]; then
            ARGS+=(--semestre "${{ inputs.backfill_semestre }}")
          fi
          if [ -n "${{ inputs.backfill_corte }}" ]; then
            ARGS+=(--corte "${{ inputs.backfill_corte }}")
          fi
          echo "=== Backfill sector (aplicar=${{ inputs.aplicar }}) ==="
          if [ "${{ inputs.aplicar }}" = "true" ]; then
            python -m observatorio.run backfill-sector --aplicar "${ARGS[@]}"
          else
            python -m observatorio.run backfill-sector "${ARGS[@]}"
          fi
      - name: Backfill habilidades e idiomas (RF-18)
        if: inputs.backfill_habilidades
        run: |
          ARGS=()
          if [ -n "${{ inputs.backfill_semestre }}" ]; then
            ARGS+=(--semestre "${{ inputs.backfill_semestre }}")
          fi
          if [ -n "${{ inputs.backfill_corte }}" ]; then
            ARGS+=(--corte "${{ inputs.backfill_corte }}")
          fi
          echo "=== Backfill habilidades/idiomas (semestre/corte opcionales) ==="
          python -m observatorio.run backfill-habilidades "${ARGS[@]}"
      - name: Purga por reglas (vista previa o aplicar)
        run: |
          echo "=== Purga por reglas (purgar=${{ inputs.purgar }}, aplicar=${{ inputs.aplicar }}) ==="
          ARGS=()
          if [ "${{ inputs.purgar }}" = "true" ] && [ "${{ inputs.aplicar }}" = "true" ]; then
            ARGS+=(--purgar --aplicar)
          fi
          python -m observatorio.run purga-reglas "${ARGS[@]}"
      - name: Cerrar corridas colgadas en curso/cola
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "=== Reconciliar corridas en_curso / en_cola ==="
          python -m observatorio.run cerrar-colgadas
